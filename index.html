<!DOCTYPE html>
<html>
<head>
  <title>Manga Reader</title>
  <style>
    body {
      background:#0f1115;
      color:white;
      font-family:sans-serif;
      display:flex;
      height:100vh;
      align-items:center;
      justify-content:center;
      margin:0;
    }

    .box {
      background:#161b24;
      padding:56px;
      border-radius:18px;
      text-align:center;
      width:420px;
      max-width:92%;
    }

    h2 {
      font-size:28px;
    }

    button {
      padding:22px;
      font-size:22px;
      border:none;
      border-radius:14px;
      background:#2b6cff;
      color:white;
      cursor:pointer;
      width:100%;
      margin-top:20px;
    }

    .hint {
      margin-top:24px;
      font-size:16px;
      color:#9aa4b2;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Welcome</h2>

  <button onclick="goLogin()">Login as Guest</button>

  <div class="hint">
    Username: <b>guest</b><br>
    Password: <b>Guest123</b>
  </div>
</div>

<script>
function goLogin() {
  window.location =
    "http://mc.terohost.in:26351/login";
}
</script>

</body>
</html>
